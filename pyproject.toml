[project]
name = "edr-xarray"
version = "0.1.0"
description = "Generic OGC API-EDR 1.1 xarray backend"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "edr-xarray contributors" }]
keywords = ["xarray", "edr", "ogc", "environmental-data-retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "xarray>=2024.6.0",
    "numpy>=1.24",
    "httpx>=0.25",
]

[project.entry-points."xarray.backends"]
edr = "edr_xarray.backend:EdrBackendEntrypoint"

[project.urls]
Repository = "https://github.com/edr-xarray/edr-xarray"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edr_xarray"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ANN", "D", "SIM", "TID"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests against live EDR server (requires EDR_LIVE_URL env)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/edr_xarray"]
branch = true
