name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy --strict src/edr_xarray

      - name: Type check (pyright)
        run: uv run pyright

      - name: Verify public types (pyright)
        run: uv run pyright --verifytypes edr_xarray --ignoreexternal

      - name: Test with coverage
        run: uv run pytest --cov=src/edr_xarray --cov-fail-under=95 -v -m "not live"

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: quality-gate
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Verify release tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Stage publish distributions
        run: |
          mkdir -p dist-pypi
          cp dist/*.tar.gz dist/*.whl dist-pypi/

      - name: Check distributions
        run: uvx twine check dist-pypi/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
